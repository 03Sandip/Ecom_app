name: Build Flutter App

on:
  push:
    paths:
      - 'client_side/client_app/**'
    branches:
      - main
  pull_request:
    paths:
      - 'client_side/client_app/**'
    branches:
      - main

jobs:
  build:
    name: Build on Flutter Stable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies
        working-directory: client_side/client_app
        run: flutter pub get

      - name: Analyze code
        working-directory: client_side/client_app
        run: flutter analyze

      - name: Run tests
        working-directory: client_side/client_app
        run: flutter test

      - name: Build APK (Release)
        working-directory: client_side/client_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ecoms-apk
          path: client_side/client_app/build/app/outputs/flutter-apk/app-release.apk
